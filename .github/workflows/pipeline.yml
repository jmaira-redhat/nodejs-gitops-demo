name: CI-CD-Pipeline
# trigger pipeline on push to main branch, but ignore changes to overlays directory
on:
  push:
    branches: [ main ]
    paths-ignore: ['overlays/**', 'bootstrap/**']
# Add this block:
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login to Quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Calculate Short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and Push
        run: |
          # Use the short SHA from the previous step
          IMAGE="quay.io/jmaira/gitopsdemo:${{ steps.vars.outputs.sha_short }}"
          docker build -t $IMAGE .
          docker push $IMAGE

      - name: Update Dev Manifest
        run: |
          cd overlays/dev
          # Update the image tag in kustomization.yaml with Short SHA
          kustomize edit set image quay.io/jmaira/gitopsdemo=quay.io/jmaira/gitopsdemo:${{ steps.vars.outputs.sha_short }}
          
          # Update the IMAGE_INFO patch with Short SHA
          sed -i "s|value: \"quay.io/jmaira/gitopsdemo:.*\"|value: \"quay.io/jmaira/gitopsdemo:${{ steps.vars.outputs.sha_short }}\"|g" kustomization.yaml

      - name: Git Commit and Push
        run: |
           git config user.name "github-actions"
           git config user.email "github-actions@github.com"
           git add .
           git commit -m "ci: promote image to dev - ${{ steps.vars.outputs.sha_short }}"
           git push origin main
        env:
           GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}