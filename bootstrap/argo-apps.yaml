apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api-dev
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/jmaira-redhat/nodejs-gitops-demo.git
    targetRevision: HEAD
    path: overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-dev-api
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
